[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-diving-monitor"
version = "0.1.0"
description = "AI dive coach for technical divers: import UDDF dive computer logs, get dive summaries and track your progress."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Torgh" }]
requires-python = ">=3.10"
keywords = ["diving", "scuba", "technical diving", "uddf", "dive computer", "ai", "claude"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = [
    "anthropic>=0.116",
    "streamlit>=1.40",
    "plotly>=5.24",
    "pandas>=2.0",
    "mcp>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
ai-diving-monitor = "ai_diving_monitor.cli:main"
ai-diving-monitor-mcp = "ai_diving_monitor.mcp_server:main"

[project.urls]
Homepage = "https://github.com/Torgh/ai-diving-monitor"

[tool.hatch.build.targets.wheel]
packages = ["src/ai_diving_monitor"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
